<style>/* 잇섬 v3 — 오렌지 테마 디자인 토큰 */

}

<script>/* src\engine.js */
/* 잇섬 v3 엔진 — 계산(H02) · 제약 검사(H03) · 공동 배차(H04) · 귀로·정산·손해 없음 검산(H05)
   방법: 시연용 결정적 휴리스틱(제약 검사 + 지역 탐색). 최적성 미입증 → 해 상태 FEASIBLE. */
(function (root) {

  /* ───────── 시간 유틸 (항상 KST) ───────── */
  function pad(n) { return (n < 10 ? '0' : '') + n; }

    hm: function (ms) { var p = U.parts(ms); return pad(p.hh) + ':' + pad(p.mm); },

    fmtFull: function (ms) { var p = U.parts(ms); return p.y + '-' + pad(p.m) + '-' + pad(p.d) + ' ' + pad(p.hh) + ':' + pad(p.mm) + ' KST'; },

    hours: function (a, b) { return (b - a) / HOUR; },
    won: function (n) { if (n == null || isNaN(n)) return '—'; return Math.round(n).toLocaleString('ko-KR') + '원'; },
    pct: function (x, d) { if (x == null || isNaN(x)) return '—'; return (x * 100).toFixed(d == null ? 1 : d) + '%'; },
    dowKo: ['일', '월', '화', '수', '목', '금', '토']
  };

  /* ───────── H02 계산 함수 ───────── */
  var C = IT.calc = {};

  // 부피: 개당 치수×개수 / 총부피 직접 입력 구분. 총부피에 개수를 다시 곱하지 않는다.
  C.volume = function (inp) {
    var errors = [];
    if (inp.mode === 'total') {
      var t = Number(inp.totalM3);
      if (!(t > 0)) errors.push('총부피는 0보다 커야 합니다 (m³)');
      return { ok: !errors.length, errors: errors, perItemM3: null, totalM3: errors.length ? 0 : round3(t), basis: '총부피 직접 입력 ' + t + 'm³ (개수 미곱셈)' };
    }
    var w = Number(inp.w), d = Number(inp.d), h = Number(inp.h), n = Number(inp.count);
    if (!(w > 0 && d > 0 && h > 0)) errors.push('가로·세로·높이는 0보다 큰 cm 값이어야 합니다');
    if (!(n >= 1) || Math.floor(n) !== n) errors.push('개수는 1 이상의 정수여야 합니다');
    if (w > 1500 || d > 300 || h > 300) errors.push('치수가 차량 적재함을 넘습니다 (cm 단위 확인)');
    if (errors.length) return { ok: false, errors: errors, perItemM3: 0, totalM3: 0 };
    var per = w * d * h / 1e6;
    return { ok: true, errors: [], perItemM3: per, totalM3: round3(per * n), basis: w + '×' + d + '×' + h + 'cm ÷ 1,000,000 = ' + round3(per) + 'm³ × ' + n + '개' };
  };
  function round3(x) { return Math.round(x * 1000) / 1000; }

      var o = U.kst(day, pad(open) + ':00'), c = U.kst(day, pad(close % 24) + ':00') + (close >= 24 ? 24 * HOUR : 0);

    }
    return Infinity;
  };

    return p.dow === 0 || p.dow === 6;
  };

  // 구간 비용: 도선료 + 왕복 운행비 R × (제주행 α | 귀로 1−α)
  C.legCost = function (veh, dir, loaded, depMs, cfg) {
    cfg = cfg || IT.config;
    var cls = veh.cls || '12';
    var tollBase = cfg.tolls[cls][loaded ? 'loaded' : 'empty'];
    var hol = C.isHoliday(U.dateKey(depMs), cfg);
    var mult = hol ? (loaded ? cfg.tolls.holidayLoadedMult.value : cfg.tolls.holidayEmptyMult.value) : 1;
    var toll = Math.round(tollBase * mult);
    var R = cfg.runCost[cls][veh.temp === 'chilled' ? 'chilled' : 'ambient'] * (veh.type === '용차' ? cfg.charterMult.value : 1);
    var a = cfg.alpha.value;

    return { toll: toll, run: run, total: toll + run, holiday: hol, R: R,
      basis: (loaded ? '영차' : '공차') + ' 도선료 ' + toll.toLocaleString() + (hol ? '(휴일)' : '') + ' + 운행비 ' + R.toLocaleString() + '×' + (dir === 'toJeju' ? a : 1 - a) + (veh.type === '용차' ? '(용차 할증 포함)' : '') };
  };

  // 최대 잔여 방식 원 단위 배분. 동률은 소수부 큰 순 → ID 오름차순 (고정)
  C.allocate = function (total, weights) {

  // 호스트 센터 → 집하 센터 거리(km): 같은 지역 0, 육상 설정의 도로 구간(운영자 입력 km 우선, 없으면 지역 이동시간 × 권역 환산 속도)

  // 확정 직전 배차안 전체 검사 (확정 차단용): 용적·중량·칸·온도·시간·센터·차량 중복

  /* ───────── H04/H05 방향별 배차 (지역 탐색) ───────── */
  // input: { dir, now, sailings, trucks[{...veh, availAt, roaming, mandatory, earliestIdx}], orders, locked{orderId:{sailingId,truckId}},

        if (!snapshot.groundRoute && members.some(function (o) { return o.ground; })) return { ok: false, detail: '이미 확정된 운행에는 새 경로를 추가할 수 없습니다' };

      if (!routeCache.has(key)) routeCache.set(key, IT.ground.route(members, truck, sailing, ctx));

    }
    orders.forEach(function (o) {
      var list = [], fc = {};
      var lk = input.locked && input.locked[o.id];

          var pf = 1; // 추천 기준별 선택은 견적의 후보 비교(S.quote)에서 따로 함 (2026-11-15, priorityDelayFactor 삭제)

        list.push({ s: -1, t: -1, defer: true, stat: pr, delay: 0, est: pr, fcDrop: true });

    var oList = orders;
    var N = oList.length;

    oList.forEach(function (o) { var m = {}; opts[o.id].forEach(function (x) { if (!x.defer) m[x.s + '|' + x.t] = 1; }); optKey[o.id] = m; });
    var byOwner = {}; oList.forEach(function (o, i) { if (!o.forecast) (byOwner[o.companyId] = byOwner[o.companyId] || []).push(i); });

      var trips = {}, cost = 0, i, o, a;

      var perSailing = {}, centerLoad = {}, selfVehicles = {};
      for (var k in trips) {
        var tr2 = trips[k], tk = trucks[k], cls = cfg.vehicleClasses[tk.cls];

        if (members.some(function (o) { return o.ground; })) cls = Object.assign({}, cls, { maxKg: tk.maxKg || cls.maxKg, m3: tk.m3 || cls.m3 });

<script>/* src\ui-operator.js */

  function loadKpi(st, L) {
    var scopes = D.enabled(st) ? [['demo', '발표 출항 이력'], ['app', '앱 출항 기록'], ['all', '전체 출항 기록']] : [['app', '앱 출항 기록']];
    var scopeLabel = scopes.find(function (a) { return a[0] === L.scope; })[1];
    function option(value, label, selected) { return '<option value="' + esc(value) + '"' + (selected ? ' selected' : '') + '>' + esc(label) + '</option>'; }
    var date = md(U.kst(L.day, '12:00'));
    var rows = L.trips.map(function (t) {
      return '<tr><td>' + esc(t.vessel) + ' · ' + U.hm(t.departureAt) + '</td><td>' + esc(t.truckId) + '</td><td>' + t.ownSlots +

      '</div><div class="s">' + date + ' 출항 ' + L.trips.length + '회 · 제주행 영차 · 목표 ' + U.pct(D.target(st), 0) + '</div>' +
      '<div class="s" id="loadSource">' + (L.assumed ? '출항 가정 데이터' + (L.scope === 'all' ? ' 포함' : '') : scopeLabel) + '</div>' +
      '<details' + (UI.st.loadOpen ? ' open' : '') + '><summary data-act="loadDetails">집계 내역 보기</summary><div class="btns small">' +
      '<label>자료 범위 <select data-act="loadScope">' + scopes.map(function (a) { return option(a[0], a[1], a[0] === L.scope); }).join('') + '</select></label>' +
      '<label>출항일 <select data-act="loadDay">' + (L.dates.length ? L.dates : [L.day]).map(function (d) { return option(d, d, d === L.day); }).join('') + '</select></label></div>' +
      (rows ? '<p class="small">적재 ' + L.loaded + '/' + L.capacity + '칸 · 빈 칸 ' + (L.capacity - L.loaded) +

        '<div class="tbl-wrap"><table class="t small"><thead><tr><th>배편·출항</th><th>차량</th><th>자사</th><th>타사</th><th>적재/총칸</th><th>빈 칸</th><th>적재율</th><th>출처</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<div class="htrucks mt">' + L.trips.map(function (t) { return departureTruck(t, st); }).join('') + '</div>' : '<p class="small muted">이 범위에 출항한 제주행 영차가 없어요.</p>') +
      (L.empty || L.invalid ? '<p class="small muted">집계 제외 · 공차 ' + L.empty + '회 · 제원·적재 확인 필요 ' + L.invalid + '회</p>' : '') +
      '</details></div>';
  }
  A.loadDetails = function (el) {

  function waitTime(h) { return h.toFixed(1) + '시간'; }

  }
  function waitExample() {
    var ready = U.kst('2026-11-15', '07:00');
    var solo = U.kst('2026-11-16', '01:00'), joint = U.kst('2026-11-15', '14:00');

    try { var st = JSON.parse(e.newValue); if (st && st.schema === 3) { var role = S.state.role, view = S.state.viewCompany; S.state = st; S.state.role = role; S.state.viewCompany = view; S._plan = null; S._planVer = -1; UI.render(); } } catch (err) { /* 무시 */ }
  });

  // 기준 시각 = 실제 현재 시각: 1분마다 다시 읽어 30분 단위가 바뀌면 앞으로만 옮긴다 (시연에서 출항으로 앞당긴 시각은 되돌리지 않음)
  function tickClock() {
    if (IT.fixedClock()) return;
    var c = IT.clockNow();
    if (c > S.state.now) { S.commit(null, function (st) { st.now = c; }, true); UI.render(); }
  }
  IT.boot = function () {
    S.load();
    if (S.state.demoStep == null) S.state.demoStep = 0;
    tickClock();
    setInterval(tickClock, 60000);
    UI.render();
    // 예측·결항 모델 학습(브라우저, 실제 실행) — 끝나면 잠정 계획에 반영
    if (IT.ai && IT.ai.trainAsync) IT.ai.trainAsync(function () { if (IT.ai.applyLive) IT.ai.applyLive(); UI.render(); });
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>IT.boot();</script>
